[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntaxsage"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.25",
    "click>=8.1",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.scripts]
syntaxsage = "cli:cli"

[tool.setuptools]
py-modules = ["cli", "config", "app"]

[tool.setuptools.packages.find]
exclude = ["venv*", "tests*"]
